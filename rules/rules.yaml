  freshdesk-export: { title: "Freshdesk, ticket export", url: "https://support.freshdesk.com/support/solutions/articles/225158" }
  salesforce-field-history: { title: "Salesforce, field history tracking", url: "https://developer.salesforce.com/docs/atlas.en-us.securityImplGuide.meta/securityImplGuide/tracking_field_history.htm" }
  spotsaas-disposition: { title: "Spotsaas, disposition taxonomy", url: "https://www.spotsaas.com/resources/call-center-software/disposition-taxonomy" }
  mosaic-categorisation: { title: "Mosaic, ticket categorisation", url: "https://getmosaic.ai/blog/support-ticket-categorization-best-practices" }
  supportbench-taxonomy: { title: "Supportbench, support taxonomy", url: "https://www.supportbench.com/building-support-taxonomy-tag-tickets-product-insights/" }
  xebia-contact-reasons: { title: "Xebia, categorising contact reasons", url: "https://xebia.com/blog/four-practical-tips-on-how-to-categorize-contact-reasons/" }
  intercom-knowledge-sources: { title: "Intercom, knowledge sources for AI agents", url: "https://www.intercom.com/help/en/articles/9440354-knowledge-sources-to-power-ai-agents-and-self-serve-support" }
  intercom-content: { title: "Intercom, optimising content for Fin", url: "https://www.intercom.com/help/en/articles/7860255-optimizing-content-for-fin" }
  agentforce-knowledge: { title: "Salesforce, Agentforce and Knowledge", url: "https://help.salesforce.com/s/articleView?id=004333412&language=en_US&type=1" }
  forethought-faq: { title: "Forethought FAQ", url: "https://forethought.ai/faq" }
  zendesk-ticket-object: { title: "Zendesk, Ticket object reference", url: "https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/" }
  freshdesk-api: { title: "Freshdesk, API reference (Tickets)", url: "https://developers.freshdesk.com/api/" }
