# Support Signal rules
# The single source of truth. The engine runs these; the published rules
# pages and the tests are generated from the same file.
#
# STATUS: draft. Every threshold marked provisional is a starting point to
# calibrate against real exports, not evidence. Don't quote them publicly.
#
# Threshold shape: { dir: higher|lower, pass: number, warn: number }
#   higher: pass if value >= pass, warn if >= warn, else fail
#   lower:  pass if value <= pass, warn if <= warn, else fail

# VERSIONING. Both versions below must be bumped on any change to what the tool
# reports: a new or changed check, threshold, outcome, floor or wording. Three
# behaviour changes once shipped under one version pair, which left a pasted report
# unable to say which build produced it. The report also carries meta.build, the
# commit SHA, stamped into dist by the deploy workflow -- a commit cannot contain its
# own SHA, so it is not committed, and an unstamped build says so rather than lying.
meta:
  version: 0.11.0
  status: draft
  updated: 2026-10-05
  outcomes:
    pass: { label: Green, text: The data supports this. }
    warn: { label: Amber, text: Usable with care. The reason says what to watch. }
    fail: { label: Red, text: Don't build on this yet. }
    not_in_export: { label: Not in export, text: The export doesn't contain this. Not a judgement on your system. }
    needs_human: { label: Needs a human, text: Can't be judged automatically. The report says what to look at. }
    too_few: { label: Too few to judge, text: "The column holds some values, but too few to judge anything from. The reason says how many it found." }
    ambiguous_dates: { label: Date order unclear, text: "A date column could be read day-first or month-first and nothing in it settles which. Choose the order in the mapping table and this can be judged." }
    free_text: { label: Looks like free text, text: "The column mapped to this field holds free text rather than a short repeated label, so it can't be judged as one. The reason says what it found and where the column probably belongs." }

# How much evidence a check or signal needs before it may judge what a field's values
# say. Nearly empty is not fine: a reason column filled on 2 of 543 cases produced a
# green "Reasons describe customer needs", an amber warning about sprawl across its two
# values, and "100% of cases that have one" from two cases. Both floors must be met.
#
# PROVISIONAL, like every threshold here: a starting point to calibrate against real
# exports, not evidence. min_cases is the conventional small-sample floor and matches
# the per-reason minimum theme movers already used. Don't quote either publicly.
evidence_floor:
  min_cases: 30      # real values, counted per case, not per row
  min_share: 0.05    # and that many must be at least this share of all cases
  provisional: true

# What may be quoted back out of the export, and how much of it.
#
# The page's promise is that the file never leaves the browser. It kept that promise
# and then handed the reader a report to paste elsewhere: with a free-text column
# mapped to contact reason, AI2's detail and the copied JSON carried hundreds of
# complete case summaries, names and email addresses among them. No byte was uploaded
# and the promise was still broken.
#
# The rule: nothing from the export reaches the report except a short category label.
# Values are clipped, lists are capped, and a column holding prose is never quoted at
# all -- not clipped, not sampled, not at any length.
echo:
  max_chars: 40      # a category label is short; anything longer is not a label
  max_examples: 3    # AI2 quoted every team-type reason it found, B3 every pair

# A column mapped to a category field that turns out to hold free text. 468 distinct
# values over 543 cases, sentences long, was accepted as contact reason and judged as a
# reason taxonomy: near-duplicate pairs, team-type wording, demand concentration, all
# computed over prose. A category field wants a short label repeated across many cases.
#
# PROVISIONAL, like every threshold here. Both tests are deliberately generous: the
# case that prompted them sat at 0.86 unique and well over five words, so there is room
# before either fires. Don't quote them publicly.
category_free_text:
  max_unique_share: 0.5    # above this share of distinct values it is not a category
  max_avg_words: 5         # or this many words per value on average
  provisional: true
  # One wording for every check that reports it: the conclusion is the same each time,
  # that the column is not a category, and four near-identical titles would only drift.
  # {field} {column} {distinct} {cases} {words} are substituted by the engine. Only
  # counts and names are substituted, never a value out of the export.
  title: "{field} looks like free text"
  text: "{field} is mapped to \u201c{column}\u201d, which holds {distinct} distinct values across {cases} cases, averaging {words} words each. A category field needs a short label repeated across many cases, so this can't be judged as one. If the column is an agent's write-up, map it to Resolution note instead, where long text is what's expected."

# 03/12/2026 is the third of December or the twelfth of March. The value cannot say
# which, so the column does: any value with a number above 12 in one position settles
# the order for the whole column. Where nothing settles it, the order is not guessed --
# it was, day-first and silently, which read every US-ordered export with its days and
# months swapped and reported nothing.
#
# Wording for the two unresolved cases. {field} {column} {examined} {ambiguous} are
# substituted by the engine; counts and names only, never a value from the export.
date_order:
  title: "{field} date order is unclear"
  mixed_title: "{field} holds two date formats"
  ambiguous: "{field} is mapped to \u201c{column}\u201d, whose dates are written as three numbers with no month name and no four-digit year first. Every one of the {examined} values read could be either day-first or month-first, so nothing in the column settles it. Choose the order in the mapping table and the checks that read dates will run."
  mixed: "{field} is mapped to \u201c{column}\u201d, which holds both orders: some values are only valid read day-first and others only month-first. That is two date formats in one column rather than one order to choose, so it needs fixing in the export before these dates can be read."

placeholders: ["", "n/a", "na", "none", "null", "-", "--", "tbc", "tbd", "unknown", "other", "general", "misc", "miscellaneous", "not set", "(blank)"]
junk_text: ["help", "urgent", "question", "issue", "problem", "re:", "fw:", "hi", "hello", "support", "asap", "query"]
team_words: ["tier", "l1", "l2", "l3", "team", "escalated", "escalation", "queue", "transfer", "transferred", "backlog"]

# Each field declares which file its synonyms are matched against, through `file:`.
# Omitted means `case`. The engine maps one file at a time and only offers that
# file's fields, so the same header can mean different things in each:
#   case   (default) matched only against a case export
#   bot    matched only against a bot conversations export
#   both   matched against either; the column means the same thing in both files
# This is what lets `reopens` be the case field reopen_count in a case export and
# the bot field bot_reopens in a bot export, and what stops a case export's
# `conversation_id` being absorbed by bot_conversation_id.
fields:
  case_id:         { label: Case ID, shape: id, required: true, synonyms: [case id, ticket id, id, case number, ticket number, casenumber, conversation id, hs object id, issue key, ticket key] }
  created_at:      { label: Created, shape: date, required: true, synonyms: [created, created at, created date, opened, date opened, createddate] }
  closed_at:       { label: Closed, shape: date, required: true, synonyms: [closed, closed at, closed date, solved at, resolved at, date closed, closeddate, resolution date, resolutiondate] }
  status:          { label: Status, shape: category, required: true, synonyms: [status, state, hs pipeline stage] }
  owner:           { label: Owner, shape: category, synonyms: [owner, assignee, agent, case owner, assigned to, ownerid, assignee id, responder id, admin assignee id],
    means: "who the case is assigned to",
    unlocks: "the routing-quality check B1, and the per-owner signals once history or an owner count is present" }
  group:           { label: Group or queue, shape: category, synonyms: [group, queue, team, department, group id, team assignee id],
    means: "the team or queue holding the case",
    unlocks: "routing quality B1, the escalation cross-check B7, and the by-group breakdown in the slow-cases and open-work signals" }
  reason:          { label: Contact reason, shape: category, synonyms: [reason, category, case reason, contact reason, disposition, type, topic, hs ticket category],
    means: "why the customer got in touch",
    unlocks: "every theme question: catch-all share B2, near-duplicate reasons B3, team-type reasons AI2, theme movers, self-help and keep-a-human" }
  subject:         { label: Subject, shape: text, synonyms: [subject, title, summary],
    means: "the case's one-line summary",
    unlocks: "usable customer wording AI1, and the billing churn driver" }
  description:     { label: Description, shape: text, synonyms: [description, body, first message, details, description text, content],
    means: "the customer's first message",
    unlocks: "usable customer wording AI1" }
  # `file: both`: the bot export carries account, account size and product columns
  # with the same meaning as the case export's, so they are reused rather than
  # duplicated as bot_* fields. B11 reads account_id off the bot file to tell its
  # warn case (account plus timings) from not_in_export.
  account_id:      { label: Account, shape: id, file: both, synonyms: [account, account id, organization, organisation, company, customer id, accountid, organization id, company id],
    means: "which customer the case belongs to",
    unlocks: "account linkage B9, and every churn driver, none of which can run without cases grouped by account" }
  account_size:    { label: Account size, shape: category, file: both, synonyms: [account size, size, tier, plan, seats band, segment size],
    means: "the account's size, plan or tier band",
    unlocks: "stratification B10, so case volume can be told apart from a real churn driver" }
  segment:         { label: Product or segment, shape: category, file: both, synonyms: [product, segment, product line, region],
    means: "the product line or region",
    unlocks: "stratification B10, and it is preferred over account size as the churn control" }
  channel:         { label: Channel, shape: category, synonyms: [channel, origin, via, source],
    means: "how the case arrived",
    unlocks: "the email and chat volume estimate AI6, and the phone-contact churn driver" }
  priority:        { label: Priority, shape: category, synonyms: [priority, severity, hs ticket priority],
    means: "the case's priority or severity",
    unlocks: "the high-priority churn driver" }
  reopen_count:    { label: Reopens, shape: number, synonyms: [reopens, reopen count, times reopened],
    means: "how many times the case was reopened",
    unlocks: "reopen history C2 and B6, and the reopened-case churn driver" }
  follow_up_of:    { label: Follow-up of, shape: id, synonyms: [follow up of, follow-up of, parent case, related case],
    means: "ID of the original case",
    unlocks: "repeat contact after closure B6, which reopen counts on their own miss" }
  escalated:       { label: Escalated flag, shape: flag, synonyms: [escalated, is escalated, isescalated, fr escalated],
    means: "whether the case was escalated",
    unlocks: "the escalation-flag check B7, which holds the flag up against what history shows" }
  owner_changes:   { label: Owners count, shape: number, synonyms: [owner changes, assignee stations, assignees, owner count],
    means: "how many owners the case passed through",
    unlocks: "counts-only history C2, and the handoff and slow-and-passed-around signals where there is no change log" }
  group_changes:   { label: Groups count, shape: number, synonyms: [group changes, group stations, groups, queue changes],
    means: "how many teams or queues the case passed through",
    unlocks: "counts-only history C2" }
  wait_time:       { label: Customer wait time, shape: number, synonyms: [requester wait minutes, requester wait time, on hold time, pending time, wait time, wait minutes],
    means: "time the case spent waiting on the customer",
    unlocks: "the resolution-time caveat B5, which says whether slow really means slow" }
  resolution_note: { label: Resolution note, shape: text, synonyms: [resolution, resolution note, solution, resolution notes, close notes],
    means: "how the case was solved",
    unlocks: "the solution-record check AI4, and the documented share on self-help candidates" }
  linked_article:  { label: Linked article, shape: id, synonyms: [article, linked article, kb article, macro, knowledge article],
    means: "the knowledge article or macro used",
    unlocks: "the solution-record check AI4" }
  last_update_at:  { label: Last update, shape: date, synonyms: [last update, last updated, last public update, updated at, last modified, updated],
    means: "when the case last changed",
    unlocks: "the open-work-at-risk signal; derived from the latest public comment when no column carries it" }
  csat_score:      { label: CSAT score, shape: number, synonyms: [csat, satisfaction, csat score, satisfaction rating, rating, conversation rating],
    means: "the survey score the customer gave",
    unlocks: "survey coverage B8, the CSAT column on the handoff signal, and the low-CSAT churn driver" }
  churned:         { label: Churned, shape: flag, synonyms: [churned, churn, cancelled, lost],
    means: "whether the account later left",
    unlocks: "every churn driver; without an outcome column no case pattern can be tested against one" }
  exit_event:      { label: Exit event, shape: category, synonyms: [exit event, cancellation, deregistration],
    means: "a cancellation or similar event logged on the case",
    unlocks: "the exit-events signal, for whoever owns retention" }

  # Comment-level fields, for an export with one row per case comment or email.
  # `level: comment` marks a column whose value belongs to the row, not the case:
  # the collapser lets these vary within a case without calling it a conflict, and
  # everything else is a case-level field that must agree.
  #
  # Synonyms are the qualified forms only. Unqualified `body` and `created_at` are
  # already claimed by description and created_at in case scope, and a joined export
  # is exactly where that header is ambiguous, so the collapser reports the clash as
  # a conflict naming the field and the mapping table lets it be moved by hand.
  comment_id:          { label: Comment ID, shape: id, level: comment, synonyms: [comment id, note id, conversation part id, comment number, reply id],
    means: "the comment's own identifier",
    unlocks: "an exact comment count: without one, two short replies sent in the same minute look like one row sent twice, so the counts are a floor" }
  comment_body:        { label: Comment body, shape: text, level: comment, synonyms: [comment body, comment body text, comment text, comment plain body, comment html body, note body, note body text, hs note body, public comment body, reply body],
    means: "the comment's text",
    unlocks: "customer wording from the comments AI1, and the billing churn driver, in exports where the subject and description are empty" }
  comment_at:          { label: Comment time, shape: date, level: comment, synonyms: [comment at, comment created at, comment created, comment time, comment date, note created at, note at, hs timestamp, reply created at, conversation part created at],
    means: "when the comment was posted",
    unlocks: "comment ordering, and the last-update derivation when no case column carries it" }
  comment_author:      { label: Comment author, shape: category, level: comment, synonyms: [comment author, comment author id, comment user id, note author, note user id, hubspot owner id, comment created by, reply author],
    means: "who wrote the comment",
    unlocks: "nothing yet: it is read and kept with each comment, but no check reads it" }
  comment_author_type: { label: Comment author type, shape: category, level: comment, synonyms: [comment author type, author type, comment author kind, note author type, commenter type],
    means: "whether an agent or the customer wrote it",
    unlocks: "nothing yet: it is read and kept with each comment, but no check reads it" }
  # Public and internal are one question with two spellings of opposite polarity:
  # Zendesk and Jira Service Management publish `public` (true means public),
  # Freshdesk publishes `private` (true means internal). One field would read
  # `private: true` as public and quietly invert every "latest public comment", so
  # each polarity gets its own field and the engine folds them to one answer.
  # Guessing either of these from values alone is the one mistake they exist to stop.
  # Two flag columns are identical in their values, so shape cannot tell public from
  # private, and getting it backwards inverts every "latest public comment" in silence.
  # A guess therefore needs the header to carry the polarity; a name match already does.
  comment_public:      { label: Comment is public, shape: flag, level: comment, synonyms: [comment public, comment is public, is public comment, public comment, comment visible to customer, jsd public],
    guess_requires_word: [public, published, visible, external],
    means: "whether the customer could see the comment, true meaning public",
    unlocks: "a last update taken from the latest public comment rather than from an internal note" }
  comment_private:     { label: Comment is internal, shape: flag, level: comment, synonyms: [comment private, comment is private, comment internal, comment is internal, internal note, private note, note private, is internal comment],
    guess_requires_word: [private, internal, hidden],
    means: "whether the comment is an internal note, true meaning internal",
    unlocks: "the same question as comment is public, read the other way round" }

  # Bot conversation fields, for the resolution audit. Matched only against a bot
  # export, so these synonyms are free to repeat ones used by the case fields
  # above. Field order carries no meaning: the two sets no longer share a
  # namespace, so there is no first-match race to win.
  bot_conversation_id:  { label: Bot conversation ID, shape: id, file: bot, synonyms: [bot conversation id, conversation id, bot chat id, chat id, session id] }
  bot_started_at:       { label: Bot conversation started, shape: date, file: bot, synonyms: [started at, bot started at, conversation started at] }
  bot_ended_at:         { label: Bot conversation ended, shape: date, file: bot, synonyms: [ended at, bot ended at, conversation ended at] }
  bot_intent:           { label: Bot intent, shape: category, file: bot, synonyms: [intent, bot intent, detected intent, detected theme] }
  bot_claimed_resolved: { label: Bot claimed resolved, shape: flag, file: bot, synonyms: [claimed resolved, bot claimed resolved, claimed resolution] }
  bot_customer_message: { label: Customer message, shape: text, file: bot, synonyms: [customer message, first message, customer wording, utterance] }
  # Shares every synonym with the case field reopen_count, which is the point: in
  # a case export `reopens` is reopen_count and check B6 reads it, in a bot export
  # the same header is this field and the audit's reopened bucket reads it.
  bot_reopens:          { label: Bot conversation reopens, shape: number, file: bot, synonyms: [reopens, reopen count, times reopened] }
  # Deliberately excludes "follow up of", "parent case" and "related case": those
  # belong to the case field follow_up_of, which check B6 reads. A bot link column
  # must never win that header, in either direction.
  bot_linked_cases:     { label: Linked cases, shape: id, file: bot, synonyms: [linked case ids, linked cases, linked case id, bot linked cases] }

checks:
  - id: C1
    band: C
    dimension: completeness
    reads_fields: [case_id, created_at, closed_at, status]
    title: Core columns are present
    failure_title: Core columns are missing
    metric: Share of the four core fields (case ID, created, closed, status) found in the export
    threshold: { dir: higher, pass: 1.0, warn: 0.75 }
    why: Case ID, opened, closed and status underpin every other check and signal.
    fix: Add the missing columns to the export. All major helpdesks have them as standard fields.
    refs: [dama-nl]

  - id: C2
    band: C
    dimension: completeness
    reads_fields: [owner_changes, group_changes, reopen_count]
    title: Case history is available
    failure_title: Only a final-state snapshot
    metric: History file present (green), count columns only (amber), neither (not in export)
    why: Without history you can't see transfers, reopens or how long cases sat with each team. Standard CSV exports usually leave it out.
    fix: In Zendesk, add ticket metrics fields or pull ticket audits through the API. In Salesforce, turn on field history for Owner and Status and export Case History.
    refs: [zendesk-exports, freshdesk-export, zendesk-ticket-metrics]

  - id: C3
    band: C
    dimension: timeliness
    requires_dates: [created_at]   # reads the dates themselves, not just whether the column is there
    reads_fields: [created_at]
    title: History covers the period analysed
    failure_title: History is shorter than the period analysed
    metric: Share of cases created after history tracking began
    threshold: { dir: higher, pass: 0.95, warn: 0.6, provisional: true }
    why: Salesforce keeps field history for up to 18 months, and only from when tracking was switched on. Older cases look as if they never moved.
    fix: Limit analysis to the period history covers, or extend retention.
    refs: [salesforce-field-history]

  - id: C4
    band: C
    dimension: uniqueness
    reads_fields: [case_id]
    title: Each case appears once
    failure_title: Cases appear more than once
    warn_title: Some cases appear more than once
    # A dirty collapse is a different fault from a repeated case ID and has to be named
    # as one: "cases appear more than once" sends someone looking for duplicate rows
    # that aren't there, when what they have is a comment column mapped as a case field.
    conflict_title: A column mapped as a case field changes between comments
    conflict_fix: >-
      Map that column to a comment field instead, or leave it unmapped. If it really is
      a case field, find what writes a different value per comment row: the collapse
      keeps the first value it sees for each case and drops the rest.
    # Judged at case level, and what that means depends on the file's shape. The
    # engine picks by shape; both are this one question asked of the shape in hand.
    metric: >-
      One row per case: share of rows whose case ID appears more than once. One row per
      comment: share of cases whose case-level columns disagree between their rows.
    threshold: { dir: lower, pass: 0.0, warn: 0.01, provisional: true }
    why: >-
      Two rows for one case inflate volume and distort every rate. A repeated case ID
      is only that, though, when the export is one row per case. An export with one row
      per comment or email repeats the case fields on every row by design: case
      uniqueness still holds once the rows are collapsed, so resolution time, counts
      and rates are unaffected, and the shape is named rather than failed. What can
      still go wrong there is a dirty collapse, where two rows of one case claim
      different owners or statuses and one of them has to be discarded. That is what
      this measures in a comment export.
    fix: >-
      In a one-row-per-case export, deduplicate on case ID and check whether the export
      joined a one-to-many table. In a one-row-per-comment export, nothing here needs
      fixing unless a case's rows disagree; then find what writes a case field per
      comment row, because the collapse keeps the first value and drops the rest.
    note: >-
      Rows identical in every column are dropped before this is measured, in either
      shape, and reported in what was read. In a one-row-per-case export they are also
      a repeated case ID, so they count here. In a one-row-per-comment export they do
      not: they often mean the export carries no comment ID or timestamp, so two short
      replies look identical, and that is a reason to treat the comment counts as a
      floor rather than to distrust the cases.
    refs: [dama-nl]

  - id: B1
    band: B
    dimension: completeness
    reads_fields: [owner, group, reason]
    title: Routing fields are genuinely filled
    failure_title: Routing fields are mostly empty or placeholders
    metric: Lowest real fill rate across owner, group and reason (placeholders like "N/A" and "Other" count as empty)
    threshold: { dir: higher, pass: 0.9, warn: 0.6, provisional: true }
    why: A field that is mostly "N/A" or "Other" is empty in practice, however full it looks.
    fix: Make the field required at closure and remove placeholder defaults.
    refs: [dama-nl]

  - id: B2
    band: B
    dimension: validity
    requires_category: [reason]   # meaningless unless the column really is a category
    reads_fields: [reason]
    title: Reasons aren't dominated by a catch-all
    failure_title: A catch-all reason swallows too many cases
    metric: Share of cases whose reason is blank or a catch-all such as "Other" or "General"
    threshold: { dir: lower, pass: 0.1, warn: 0.2, provisional: true }
    why: Whatever sits in "Other" is invisible to reporting and to any AI trained on your reasons.
    fix: Sample the catch-all, split its biggest themes into new reasons, and remove "Other" as a default.
    refs: [spotsaas-disposition, mosaic-categorisation]
    note: Practitioner rules of thumb only. No research-grade threshold exists.

  - id: B3
    band: B
    dimension: consistency
    requires_values: [reason]   # judges what the reasons say, so it needs enough of them
    requires_category: [reason]   # meaningless unless the column really is a category
    reads_fields: [reason]
    title: Reason codes are a tidy set
    failure_title: Reason codes have sprawled
    too_few_title: Reason codes can't be judged
    metric: Near-duplicate reason pairs (green none, amber up to 3) and share of reasons used fewer than 5 times
    why: Duplicates like "SSO" and "Single sign-on" split one issue in two and make trends meaningless.
    fix: Merge near-duplicates, retire rarely used values, and keep each level to a handful of options.
    refs: [supportbench-taxonomy, xebia-contact-reasons]

  - id: B4
    band: B
    dimension: consistency
    requires_dates: [created_at, closed_at]   # reads the dates themselves, not just whether the column is there
    reads_fields: [created_at, closed_at, status]
    title: Dates make sense
    failure_title: Impossible dates found
    metric: Share of cases closed before they were created, or with a status that contradicts the close date
    threshold: { dir: lower, pass: 0.005, warn: 0.02, provisional: true }
    why: One bad date can wreck an average resolution time.
    fix: Find the automation or import writing bad dates, and exclude affected cases until fixed.
    refs: [dama-nl]

  - id: B5
    band: B
    dimension: validity
    reads_fields: [wait_time]
    title: Resolution time separates customer wait
    failure_title: Can't separate customer wait from agent work
    metric: A customer-wait or on-hold time field is present and filled
    why: Zendesk's full resolution time includes pending time and runs to the last solve. Without a wait field, "slow" may just mean "waiting on the customer".
    fix: Add requester-wait or on-hold time to the export.
    refs: [zendesk-durations]

  - id: B6
    band: B
    dimension: validity
    reads_fields: [reopen_count, follow_up_of]
    title: Reopens can be counted
    failure_title: Reopens are invisible
    metric: Reopen count present (amber); plus follow-up cases linked to originals (green)
    why: In Zendesk, a reply to a closed ticket creates a new follow-up ticket instead of a reopen, so reopen counts miss repeat contacts.
    fix: Include the reopens metric and link follow-up tickets to their originals.
    refs: [zendesk-follow-up]

  - id: B7
    band: B
    dimension: validity
    reads_fields: [escalated, group]
    title: The escalation flag is actually used
    failure_title: The escalation flag is rarely set
    metric: Share of cases flagged, compared with the share that history shows moving to engineering or tier 3
    why: A flag that's almost never set usually means nobody sets it, not that nothing happens.
    fix: Set the flag automatically from the routing event, or stop reporting on it.
    refs: []

  - id: B8
    band: B
    dimension: completeness
    reads_fields: [csat_score, status]
    title: Survey scores are linked to cases
    failure_title: Few closed cases carry a survey score
    metric: Share of closed cases with a CSAT score
    threshold: { dir: higher, pass: 0.15, warn: 0.05, provisional: true }
    why: Survey analysis needs enough linked responses, and the happiest customers answer most, so low coverage hides real gaps.
    fix: Link survey responses to case IDs; compare who responds with who doesn't before modelling.
    refs: [mazor-response-bias]

  - id: B9
    band: B
    dimension: completeness
    reads_fields: [account_id]
    title: Cases link to accounts
    failure_title: Many cases have no account
    metric: Share of cases with a real account ID
    threshold: { dir: higher, pass: 0.95, warn: 0.8, provisional: true }
    why: Churn analysis happens at account level. Unlinked cases drop out silently.
    fix: Require an account on every case, or match on contact email domain.
    refs: [dama-nl]

  - id: B10
    band: B
    dimension: completeness
    reads_fields: [account_size, segment]
    title: You can control for account size or product
    failure_title: Nothing to control for
    metric: Account size or product/segment present and filled on 90% of cases
    threshold: { dir: higher, pass: 0.9, warn: 0.6, provisional: true }
    why: Bigger, busier accounts raise more cases and behave differently. Without a size or segment field, every apparent driver is confounded.
    fix: Join account size band and product to the export.
    refs: [catalog-confounding]

  - id: AI1
    band: B
    dimension: completeness
    reads_fields: [subject, description, comment_body]
    title: Customers' words are captured
    failure_title: Little usable customer text
    metric: Share of cases whose subject or description has five or more words and isn't a stock phrase
    threshold: { dir: higher, pass: 0.8, warn: 0.5, provisional: true }
    why: Without the customer's own words you can't discover what they want, the first job of any AI self-help project.
    fix: Include the first customer message. Zendesk CSV exports leave out descriptions, so use JSON or the API.
    refs: [zendesk-exports]
    # In a one-row-per-comment export this check counts comment bodies as wording, so
    # anything that thinned the comment rows is a caution on it. Declared here rather
    # than as a list of check IDs in the engine.
    reads: [comment_text]

  - id: AI2
    band: B
    dimension: validity
    requires_values: [reason]   # judges what the reasons say, so it needs enough of them
    requires_category: [reason]   # meaningless unless the column really is a category
    reads_fields: [reason]
    title: Reasons describe customer needs
    failure_title: Reasons describe teams, not customers
    too_few_title: Reason wording can't be judged
    metric: Share of volume whose reason names a team, tier or process ("Tier 2", "Escalated")
    threshold: { dir: lower, pass: 0.1, warn: 0.3, provisional: true }
    why: A reason like "Tier 2" tells a bot nothing about what the customer wanted. AI intents must describe the customer's need.
    fix: Keep routing in routing fields and rewrite reasons as customer needs.
    refs: [zendesk-custom-intents]

  - id: AI3
    band: B
    dimension: consistency
    requires_values: [reason]   # judges what the reasons say, so it needs enough of them
    requires_category: [reason]   # meaningless unless the column really is a category
    reads_fields: [reason]
    title: Reasons don't overlap
    failure_title: Reasons overlap
    too_few_title: Reason overlap can't be judged
    metric: Reviewed by a person in this version; the report lists near-duplicate reasons to start from
    why: Zendesk warns that overlapping intents cause "low-confidence or wrong topic detection".
    fix: Merge or redefine overlapping reasons so each covers one need.
    refs: [zendesk-custom-intents, xebia-contact-reasons]

  - id: AI4
    band: B
    dimension: completeness
    reads_fields: [resolution_note, linked_article, status]
    title: Solutions are recorded
    failure_title: Few cases record how they were solved
    metric: Share of closed cases with a resolution note or linked article
    threshold: { dir: higher, pass: 0.7, warn: 0.3, provisional: true }
    why: AI agents answer from written knowledge. If solutions live only in agents' heads, there's nothing to ground an answer in.
    fix: Require a resolution note or linked article at closure, and mine macros for missing articles.
    refs: [intercom-knowledge-sources, intercom-content, agentforce-knowledge]

  - id: AI5
    band: A
    dimension: fit for use
    requires_values: [reason]   # judges what the reasons say, so it needs enough of them
    requires_category: [reason]   # meaningless unless the column really is a category
    reads_fields: [reason]
    title: Demand is concentrated enough to automate
    failure_title: Demand is too scattered to automate easily
    too_few_title: Demand spread can't be judged
    metric: Share of cases with a real reason that fall in the ten most common reasons
    threshold: { dir: higher, pass: 0.5, warn: 0.3, provisional: true }
    why: Automation pays back fastest on frequent, repeated questions.
    fix: Start with the top themes and leave the long tail to people.
    refs: []

  - id: AI6
    band: A
    dimension: fit for use
    requires_dates: [created_at]   # reads the dates themselves, not just whether the column is there
    reads_fields: [created_at, channel]
    title: Volume meets published vendor minimums
    failure_title: Volume is below some vendors' published minimums
    metric: Total cases against Forethought's published 20,000+ historical tickets and 2,000+ email or chat tickets a month
    why: Some vendors need a minimum history to train. Most don't publish one, so ask.
    fix: Ask each vendor for its minimum before a pilot.
    refs: [forethought-faq]

  - id: B11
    band: B
    dimension: completeness
    reads_fields: []   # judges the bot export, so no case field
    title: Bot conversations can be linked to later cases
    failure_title: Bot conversations aren't linked to later cases
    warn_title: Bot conversations can only be matched by account and timing
    metric: Follow-up case IDs on each conversation (green); account plus conversation start and end times, so returns have to be matched (amber); neither in the export (not in export)
    why: The audit asks what happened after the bot claimed a resolution. Without a way to reach from a conversation to the cases that followed it, a claimed resolution can't be confirmed or contradicted, and silence can't be told apart from success.
    fix: Export the follow-up case IDs on each conversation. Failing that, export the account ID with the conversation's start and end times, which lets returns be matched by account and timing.
    refs: [zendesk-follow-up, dama-nl]
    outcomes:
      pass: Each conversation carries the cases that followed it, so claimed resolutions can be checked directly.
      warn: "Conversations carry an account and start and end times, but no case links. Matching returns by timing alone isn't supported yet, so this export can't be audited. Every claimed resolution is reported as can't tell; export the follow-up case IDs and the audit runs."
      not_in_export: This export doesn't contain the link between bot conversations and the cases that followed them. The link may well exist in your bot or your helpdesk; it isn't in these files.
      too_few: "Nothing in this file is marked as a resolution the bot claimed, so there is nothing for the audit to check. A bot conversations export records whether the bot claimed it resolved each conversation; a file with none of those is probably not one, or the claimed-resolution column has not been mapped."
      same_file: "This looks like the same file as the case export: same columns, same number of rows, same values where checked. The audit asks what happened in the cases *after* a bot conversation, so it needs the bot's own conversations, not the cases again."
    too_few_title: No claimed resolutions to audit
    same_file_title: The bot file looks like the case file
    note: >-
      The engine reports these words verbatim, and uses warn_title on the amber
      path, because the account and the timings are present and "aren't linked"
      would misdescribe the export. Only the green path is implemented. Amber is a
      limit of this tool, not a flaw in the data, so the use reports "needs a
      human" rather than amber "usable with care".

uses:
  - id: resolution
    title: Resolution time analysis
    required: [C1, C4, B4]
    optional: [B5, B6]
  - id: transfers
    title: Transfers and ownership
    required: [C1, C2]
    optional: [C3, B7]
  - id: csat
    title: CSAT and survey analysis
    required: [C1, B8]
    optional: [B2]
  - id: churn
    title: Linking cases to churn
    required: [C1, B9, B10]
    optional: [C2]
  - id: ai
    title: AI self-help readiness
    required: [AI1, AI2, AI4]
    optional: [AI3, AI5, AI6, B2, B3]
  - id: resolution_audit
    title: Bot resolution audit
    required: [B11]
    optional: []
    # This use needs a second file. Without one it still reports not_in_export, so
    # the question and what it would take are visible, but it is left out of the
    # fix-first weighting: nobody who uploaded case data alone should be told to
    # fix bot linking before fixing their cases.
    needs_file: bot

signals:
  - id: slow_passed
    title: Slow and passed-around cases
    requires_dates: [created_at, closed_at]
    unlocked_by_uses: [transfers, resolution]
    params: { slow_days: 30, min_owners: 3, provisional: true }
    shows: Cases open more than 30 days with three or more owners, by group
    disclaimer: The one service signal worth watching. Not proof that it causes churn.
  - id: handoff
    title: Handed off versus held
    requires_dates: [created_at, closed_at]
    unlocked_by_uses: [transfers]
    shows: Resolution time and CSAT for cases kept by one owner versus handed on
    disclaimer: Harder cases get handed on, so this isn't a fair comparison of teams.
  - id: theme_movers
    title: Theme movers
    requires_dates: [created_at]
    unlocked_by_any_check: [AI1, B2]
    # Grouped by reason, so a reason column with nothing in it leaves nothing to
    # compare. Unlocked by AI1, which a comment export can pass on its comment text
    # alone, so an empty reason column has to be checked separately or this reports
    # "Stable" off two empty quarters.
    requires_values: [reason]
    requires_category: [reason]
    # A reason has to appear this many times before a move in its share means anything.
    # Provisional. Below it for every reason the signal says so, rather than reporting
    # "Stable", which is a finding it has no basis for.
    params: { min_cases_per_reason: 30, provisional: true }
    shows: Reasons rising or falling in the last quarter against the previous nine months
    disclaimer: Shows what is moving, not why.
  - id: open_risk
    title: Open work at risk
    requires_dates: [created_at, closed_at]
    unlocked_by_uses: [resolution]
    requires_fields: [last_update_at]
    shows: Open cases older than 70% of closed cases took to resolve
    disclaimer: Not a prediction of which customers will leave.
  - id: exit_events
    title: Exit events
    requires_fields: [exit_event]
    shows: Cancellations and similar events logged in cases, for whoever owns retention
    disclaimer: A commercial warning recorded in support, not something support caused.
  - id: self_help
    title: AI self-help candidates
    requires_dates: [created_at, closed_at]
    unlocked_by_uses: [ai]
    requires_values: [reason]
    requires_category: [reason]
    shows: Reasons that are frequent, quick, single-owner and documented
    disclaimer: A shortlist to test, not a deflection forecast.
  - id: keep_human
    title: Keep-a-human themes
    requires_dates: [created_at, closed_at]
    unlocked_by_uses: [ai, transfers]
    requires_values: [reason]
    requires_category: [reason]
    shows: Reasons with long resolution times or many owners
    disclaimer: Where automation is most likely to frustrate customers.

# Non-blocking cautions. A caution says a number was measured on data that reached
# the engine thinned, and names what to allow for. It never changes an outcome, a
# state or a lock: a caveat on a measurement is not a verdict on the export.
#
# `applies_to_reads` matches the `reads:` tag a check, signal or driver flag
# declares, so a new reader of comment text inherits the caution by saying so.
cautions:
  conflicting_case_field:
    applies_to_reads: [conflicting_field]
    title: A column mapped as a case field changes between comments
    text: >-
      This reads a field whose value differs between a case's own comment rows, so the
      collapse kept the first value and dropped the rest. Either that column holds a
      value per comment rather than per case, in which case map it to a comment field,
      or something writes it per row and the number here is built on one row's answer.
  dropped_comment_rows:
    applies_to_reads: [comment_text, comment_count]
    title: Comment rows were dropped as identical
    text: >-
      Rows identical in every column were dropped before this was measured, so the
      comment counts are a floor rather than a count. This often means the export
      carries no comment ID or timestamp: two short replies sent at the same minute,
      such as "Thanks" twice, then look like one row sent twice. Dropping them changes
      no case: each is still there once, with the same dates, owner and reason.

# Parameters for the resolution audit. Every value is provisional: a starting
# point to calibrate against real bot exports, not evidence. Don't quote them
# publicly.
resolution_audit:
  params:
    provisional: true
    return_windows_days: [7, 14, 30]   # contradictions counted cumulatively; the largest is the whole window
    # The escalation window and the return window are adjacent, not separated: a
    # case at or inside this many minutes of the bot ending is an escalation, and
    # anything after it is a return. There is deliberately no third parameter for
    # where returns begin. A gap would quietly bank every same-theme case that
    # landed in it as "not contradicted", which is the one answer it cannot be.
    escalation_within_minutes: 60
    normalise_reasons: true            # same-theme matching must fold near-duplicate reasons ("Login Issues", "Single sign-on") to their base theme, or real returns are missed
  disclaimer: >-
    "Not contradicted" means silence, not success. It records only that no
    follow-up case appeared in the window: the customer may have given up, gone
    elsewhere, or left. Never report it as a resolution rate.

# Where the vendor column names in `fields` synonyms came from. Each name was read
# from the page named here, not recalled. A vendor missing from this list is a vendor
# whose names we could not read: better an honest gap than a plausible invention.
column_name_sources:
  zendesk: zendesk-ticket-object
  freshdesk: freshdesk-api
  intercom: intercom-conversation
  hubspot: hubspot-tickets
  jira_service_management: jira-issue-fields
  # Salesforce is deliberately absent. developer.salesforce.com returns 403 to
  # automated fetches and help.salesforce.com renders its field tables in JavaScript,
  # so the Case object's field list could not be read. The normaliser handles
  # Salesforce's shapes anyway (CaseNumber, CreatedDate, Priority__c, Date/Time
  # Opened all map correctly); only the vendor-specific synonyms are missing.

# Where the comment-level column names came from. Same rule as above: each name was
# read from the page named here. The attribute each vendor actually publishes is
# recorded so a reader can check the claim rather than take it.
#   zendesk    body, created_at, author_id, public ("true if a public comment;
#              false if an internal note"). No author-type attribute: the comment
#              carries author_id only, so comment_author_type has no Zendesk name.
#   freshdesk  body, body_text, created_at, user_id, private ("Set to true if the
#              note is private"). `incoming` was read and deliberately not adopted:
#              it means the conversation appears to come from outside the web
#              portal, which is not the same question as who wrote it.
#   intercom   conversation_part: part_type, body, created_at, author; the author
#              object carries type ("admin"; a Contact, Admin or Team).
#   jira_service_management  CommentDTO: body, created, author, public
#              ("Indicates whether the comment is public (true) or
#              private/internal (false)").
#   hubspot    note properties: hs_note_body, hs_timestamp, hubspot_owner_id.
comment_column_sources:
  zendesk: zendesk-ticket-comments
  freshdesk: freshdesk-api
  intercom: intercom-conversation-part
  intercom_author: intercom-conversation-part-author
  jira_service_management: jsm-request-comments
  hubspot: hubspot-notes

vendor_questions:
  - How do you define a resolution, and how do you count reopens?
  - Do you report containment separately from resolution?
  - What minimum ticket history and monthly volume do you need?
  - Do you learn from our past tickets, our knowledge articles, or both?
  - What happens when our reasons or tags overlap?
  - Who grades the resolutions, you or us?

