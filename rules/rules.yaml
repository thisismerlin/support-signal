# Support Signal rules
# The single source of truth. The engine runs these; the published rules
# pages and the tests are generated from the same file.
#
# STATUS: draft. Every threshold marked provisional is a starting point to
# calibrate against real exports, not evidence. Don't quote them publicly.
#
# Threshold shape: { dir: higher|lower, pass: number, warn: number }
#   higher: pass if value >= pass, warn if >= warn, else fail
#   lower:  pass if value <= pass, warn if <= warn, else fail

meta:
  version: 0.6.0
  status: draft
  updated: 2026-10-03
  outcomes:
    pass: { label: Green, text: The data supports this. }
    warn: { label: Amber, text: Usable with care. The reason says what to watch. }
    fail: { label: Red, text: Don't build on this yet. }
    not_in_export: { label: Not in export, text: The export doesn't contain this. Not a judgement on your system. }
    needs_human: { label: Needs a human, text: Can't be judged automatically. The report says what to look at. }

placeholders: ["", "n/a", "na", "none", "null", "-", "--", "tbc", "tbd", "unknown", "other", "general", "misc", "miscellaneous", "not set", "(blank)"]
junk_text: ["help", "urgent", "question", "issue", "problem", "re:", "fw:", "hi", "hello", "support", "asap", "query"]
team_words: ["tier", "l1", "l2", "l3", "team", "escalated", "escalation", "queue", "transfer", "transferred", "backlog"]

# Each field declares which file its synonyms are matched against, through `file:`.
# Omitted means `case`. The engine maps one file at a time and only offers that
# file's fields, so the same header can mean different things in each:
#   case   (default) matched only against a case export
#   bot    matched only against a bot conversations export
#   both   matched against either; the column means the same thing in both files
# This is what lets `reopens` be the case field reopen_count in a case export and
# the bot field bot_reopens in a bot export, and what stops a case export's
# `conversation_id` being absorbed by bot_conversation_id.
fields:
  case_id:         { label: Case ID, required: true, synonyms: [case id, ticket id, id, case number, ticket number, casenumber, conversation id, hs object id, issue key, ticket key] }
  created_at:      { label: Created, required: true, synonyms: [created, created at, created date, opened, date opened, createddate] }
  closed_at:       { label: Closed, required: true, synonyms: [closed, closed at, closed date, solved at, resolved at, date closed, closeddate, resolution date, resolutiondate] }
  status:          { label: Status, required: true, synonyms: [status, state, hs pipeline stage] }
  owner:           { label: Owner, synonyms: [owner, assignee, agent, case owner, assigned to, ownerid, assignee id, responder id, admin assignee id] }
  group:           { label: Group or queue, synonyms: [group, queue, team, department, group id, team assignee id] }
  reason:          { label: Contact reason, synonyms: [reason, category, case reason, contact reason, disposition, type, topic, hs ticket category] }
  subject:         { label: Subject, synonyms: [subject, title, summary] }
  description:     { label: Description, synonyms: [description, body, first message, details, description text, content] }
  # `file: both`: the bot export carries account, account size and product columns
  # with the same meaning as the case export's, so they are reused rather than
  # duplicated as bot_* fields. B11 reads account_id off the bot file to tell its
  # warn case (account plus timings) from not_in_export.
  account_id:      { label: Account, file: both, synonyms: [account, account id, organization, organisation, company, customer id, accountid, organization id, company id] }
  account_size:    { label: Account size, file: both, synonyms: [account size, size, tier, plan, seats band, segment size] }
  segment:         { label: Product or segment, file: both, synonyms: [product, segment, product line, region] }
  channel:         { label: Channel, synonyms: [channel, origin, via, source] }
  priority:        { label: Priority, synonyms: [priority, severity, hs ticket priority] }
  reopen_count:    { label: Reopens, synonyms: [reopens, reopen count, times reopened] }
  follow_up_of:    { label: Follow-up of, synonyms: [follow up of, follow-up of, parent case, related case] }
  escalated:       { label: Escalated flag, synonyms: [escalated, is escalated, isescalated, fr escalated] }
  owner_changes:   { label: Owners count, synonyms: [owner changes, assignee stations, assignees, owner count] }
  group_changes:   { label: Groups count, synonyms: [group changes, group stations, groups, queue changes] }
  wait_time:       { label: Customer wait time, synonyms: [requester wait minutes, requester wait time, on hold time, pending time, wait time, wait minutes] }
  resolution_note: { label: Resolution note, synonyms: [resolution, resolution note, solution, resolution notes, close notes] }
  linked_article:  { label: Linked article, synonyms: [article, linked article, kb article, macro, knowledge article] }
  last_update_at:  { label: Last update, synonyms: [last update, last updated, last public update, updated at, last modified, updated] }
  csat_score:      { label: CSAT score, synonyms: [csat, satisfaction, csat score, satisfaction rating, rating, conversation rating] }
  churned:         { label: Churned, synonyms: [churned, churn, cancelled, lost] }
  exit_event:      { label: Exit event, synonyms: [exit event, cancellation, deregistration] }

  # Bot conversation fields, for the resolution audit. Matched only against a bot
  # export, so these synonyms are free to repeat ones used by the case fields
  # above. Field order carries no meaning: the two sets no longer share a
  # namespace, so there is no first-match race to win.
  bot_conversation_id:  { label: Bot conversation ID, file: bot, synonyms: [bot conversation id, conversation id, bot chat id, chat id, session id] }
  bot_started_at:       { label: Bot conversation started, file: bot, synonyms: [started at, bot started at, conversation started at] }
  bot_ended_at:         { label: Bot conversation ended, file: bot, synonyms: [ended at, bot ended at, conversation ended at] }
  bot_intent:           { label: Bot intent, file: bot, synonyms: [intent, bot intent, detected intent, detected theme] }
  bot_claimed_resolved: { label: Bot claimed resolved, file: bot, synonyms: [claimed resolved, bot claimed resolved, claimed resolution] }
  bot_customer_message: { label: Customer message, file: bot, synonyms: [customer message, first message, customer wording, utterance] }
  # Shares every synonym with the case field reopen_count, which is the point: in
  # a case export `reopens` is reopen_count and check B6 reads it, in a bot export
  # the same header is this field and the audit's reopened bucket reads it.
  bot_reopens:          { label: Bot conversation reopens, file: bot, synonyms: [reopens, reopen count, times reopened] }
  # Deliberately excludes "follow up of", "parent case" and "related case": those
  # belong to the case field follow_up_of, which check B6 reads. A bot link column
  # must never win that header, in either direction.
  bot_linked_cases:     { label: Linked cases, file: bot, synonyms: [linked case ids, linked cases, linked case id, bot linked cases] }

checks:
  - id: C1
    band: C
    dimension: completeness
    title: Core columns are present
    failure_title: Core columns are missing
    metric: Share of the four core fields (case ID, created, closed, status) found in the export
    threshold: { dir: higher, pass: 1.0, warn: 0.75 }
    why: Case ID, opened, closed and status underpin every other check and signal.
    fix: Add the missing columns to the export. All major helpdesks have them as standard fields.
    refs: [dama-nl]

  - id: C2
    band: C
    dimension: completeness
    title: Case history is available
    failure_title: Only a final-state snapshot
    metric: History file present (green), count columns only (amber), neither (not in export)
    why: Without history you can't see transfers, reopens or how long cases sat with each team. Standard CSV exports usually leave it out.
    fix: In Zendesk, add ticket metrics fields or pull ticket audits through the API. In Salesforce, turn on field history for Owner and Status and export Case History.
    refs: [zendesk-exports, freshdesk-export, zendesk-ticket-metrics]

  - id: C3
    band: C
    dimension: timeliness
    title: History covers the period analysed
    failure_title: History is shorter than the period analysed
    metric: Share of cases created after history tracking began
    threshold: { dir: higher, pass: 0.95, warn: 0.6, provisional: true }
    why: Salesforce keeps field history for up to 18 months, and only from when tracking was switched on. Older cases look as if they never moved.
    fix: Limit analysis to the period history covers, or extend retention.
    refs: [salesforce-field-history]

  - id: C4
    band: C
    dimension: uniqueness
    title: Each case appears once
    failure_title: Duplicate cases found
    metric: Share of rows whose case ID appears more than once
    threshold: { dir: lower, pass: 0.0, warn: 0.01, provisional: true }
    why: Duplicates inflate volume and distort every rate.
    fix: Deduplicate on case ID and check whether the export joined a one-to-many table.
    refs: [dama-nl]

  - id: B1
    band: B
    dimension: completeness
    title: Routing fields are genuinely filled
    failure_title: Routing fields are mostly empty or placeholders
    metric: Lowest real fill rate across owner, group and reason (placeholders like "N/A" and "Other" count as empty)
    threshold: { dir: higher, pass: 0.9, warn: 0.6, provisional: true }
    why: A field that is mostly "N/A" or "Other" is empty in practice, however full it looks.
    fix: Make the field required at closure and remove placeholder defaults.
    refs: [dama-nl]

  - id: B2
    band: B
    dimension: validity
    title: Reasons aren't dominated by a catch-all
    failure_title: A catch-all reason swallows too many cases
    metric: Share of cases whose reason is blank or a catch-all such as "Other" or "General"
    threshold: { dir: lower, pass: 0.1, warn: 0.2, provisional: true }
    why: Whatever sits in "Other" is invisible to reporting and to any AI trained on your reasons.
    fix: Sample the catch-all, split its biggest themes into new reasons, and remove "Other" as a default.
    refs: [spotsaas-disposition, mosaic-categorisation]
    note: Practitioner rules of thumb only. No research-grade threshold exists.

  - id: B3
    band: B
    dimension: consistency
    title: Reason codes are a tidy set
    failure_title: Reason codes have sprawled
    metric: Near-duplicate reason pairs (green none, amber up to 3) and share of reasons used fewer than 5 times
    why: Duplicates like "SSO" and "Single sign-on" split one issue in two and make trends meaningless.
    fix: Merge near-duplicates, retire rarely used values, and keep each level to a handful of options.
    refs: [supportbench-taxonomy, xebia-contact-reasons]

  - id: B4
    band: B
    dimension: consistency
    title: Dates make sense
    failure_title: Impossible dates found
    metric: Share of cases closed before they were created, or with a status that contradicts the close date
    threshold: { dir: lower, pass: 0.005, warn: 0.02, provisional: true }
    why: One bad date can wreck an average resolution time.
    fix: Find the automation or import writing bad dates, and exclude affected cases until fixed.
    refs: [dama-nl]

  - id: B5
    band: B
    dimension: validity
    title: Resolution time separates customer wait
    failure_title: Can't separate customer wait from agent work
    metric: A customer-wait or on-hold time field is present and filled
    why: Zendesk's full resolution time includes pending time and runs to the last solve. Without a wait field, "slow" may just mean "waiting on the customer".
    fix: Add requester-wait or on-hold time to the export.
    refs: [zendesk-durations]

  - id: B6
    band: B
    dimension: validity
    title: Reopens can be counted
    failure_title: Reopens are invisible
    metric: Reopen count present (amber); plus follow-up cases linked to originals (green)
    why: In Zendesk, a reply to a closed ticket creates a new follow-up ticket instead of a reopen, so reopen counts miss repeat contacts.
    fix: Include the reopens metric and link follow-up tickets to their originals.
    refs: [zendesk-follow-up]

  - id: B7
    band: B
    dimension: validity
    title: The escalation flag is actually used
    failure_title: The escalation flag is rarely set
    metric: Share of cases flagged, compared with the share that history shows moving to engineering or tier 3
    why: A flag that's almost never set usually means nobody sets it, not that nothing happens.
    fix: Set the flag automatically from the routing event, or stop reporting on it.
    refs: []

  - id: B8
    band: B
    dimension: completeness
    title: Survey scores are linked to cases
    failure_title: Few closed cases carry a survey score
    metric: Share of closed cases with a CSAT score
    threshold: { dir: higher, pass: 0.15, warn: 0.05, provisional: true }
    why: Survey analysis needs enough linked responses, and the happiest customers answer most, so low coverage hides real gaps.
    fix: Link survey responses to case IDs; compare who responds with who doesn't before modelling.
    refs: [mazor-response-bias]

  - id: B9
    band: B
    dimension: completeness
    title: Cases link to accounts
    failure_title: Many cases have no account
    metric: Share of cases with a real account ID
    threshold: { dir: higher, pass: 0.95, warn: 0.8, provisional: true }
    why: Churn analysis happens at account level. Unlinked cases drop out silently.
    fix: Require an account on every case, or match on contact email domain.
    refs: [dama-nl]

  - id: B10
    band: B
    dimension: completeness
    title: You can control for account size or product
    failure_title: Nothing to control for
    metric: Account size or product/segment present and filled on 90% of cases
    threshold: { dir: higher, pass: 0.9, warn: 0.6, provisional: true }
    why: Bigger, busier accounts raise more cases and behave differently. Without a size or segment field, every apparent driver is confounded.
    fix: Join account size band and product to the export.
    refs: [catalog-confounding]

  - id: AI1
    band: B
    dimension: completeness
    title: Customers' words are captured
    failure_title: Little usable customer text
    metric: Share of cases whose subject or description has five or more words and isn't a stock phrase
    threshold: { dir: higher, pass: 0.8, warn: 0.5, provisional: true }
    why: Without the customer's own words you can't discover what they want, the first job of any AI self-help project.
    fix: Include the first customer message. Zendesk CSV exports leave out descriptions, so use JSON or the API.
    refs: [zendesk-exports]

  - id: AI2
    band: B
    dimension: validity
    title: Reasons describe customer needs
    failure_title: Reasons describe teams, not customers
    metric: Share of volume whose reason names a team, tier or process ("Tier 2", "Escalated")
    threshold: { dir: lower, pass: 0.1, warn: 0.3, provisional: true }
    why: A reason like "Tier 2" tells a bot nothing about what the customer wanted. AI intents must describe the customer's need.
    fix: Keep routing in routing fields and rewrite reasons as customer needs.
    refs: [zendesk-custom-intents]

  - id: AI3
    band: B
    dimension: consistency
    title: Reasons don't overlap
    failure_title: Reasons overlap
    metric: Reviewed by a person in this version; the report lists near-duplicate reasons to start from
    why: Zendesk warns that overlapping intents cause "low-confidence or wrong topic detection".
    fix: Merge or redefine overlapping reasons so each covers one need.
    refs: [zendesk-custom-intents, xebia-contact-reasons]

  - id: AI4
    band: B
    dimension: completeness
    title: Solutions are recorded
    failure_title: Few cases record how they were solved
    metric: Share of closed cases with a resolution note or linked article
    threshold: { dir: higher, pass: 0.7, warn: 0.3, provisional: true }
    why: AI agents answer from written knowledge. If solutions live only in agents' heads, there's nothing to ground an answer in.
    fix: Require a resolution note or linked article at closure, and mine macros for missing articles.
    refs: [intercom-knowledge-sources, intercom-content, agentforce-knowledge]

  - id: AI5
    band: A
    dimension: fit for use
    title: Demand is concentrated enough to automate
    failure_title: Demand is too scattered to automate easily
    metric: Share of cases with a real reason that fall in the ten most common reasons
    threshold: { dir: higher, pass: 0.5, warn: 0.3, provisional: true }
    why: Automation pays back fastest on frequent, repeated questions.
    fix: Start with the top themes and leave the long tail to people.
    refs: []

  - id: AI6
    band: A
    dimension: fit for use
    title: Volume meets published vendor minimums
    failure_title: Volume is below some vendors' published minimums
    metric: Total cases against Forethought's published 20,000+ historical tickets and 2,000+ email or chat tickets a month
    why: Some vendors need a minimum history to train. Most don't publish one, so ask.
    fix: Ask each vendor for its minimum before a pilot.
    refs: [forethought-faq]

  - id: B11
    band: B
    dimension: completeness
    title: Bot conversations can be linked to later cases
    failure_title: Bot conversations aren't linked to later cases
    warn_title: Bot conversations can only be matched by account and timing
    metric: Follow-up case IDs on each conversation (green); account plus conversation start and end times, so returns have to be matched (amber); neither in the export (not in export)
    why: The audit asks what happened after the bot claimed a resolution. Without a way to reach from a conversation to the cases that followed it, a claimed resolution can't be confirmed or contradicted, and silence can't be told apart from success.
    fix: Export the follow-up case IDs on each conversation. Failing that, export the account ID with the conversation's start and end times, which lets returns be matched by account and timing.
    refs: [zendesk-follow-up, dama-nl]
    outcomes:
      pass: Each conversation carries the cases that followed it, so claimed resolutions can be checked directly.
      warn: "Conversations carry an account and start and end times, but no case links. Matching returns by timing alone isn't supported yet, so this export can't be audited. Every claimed resolution is reported as can't tell; export the follow-up case IDs and the audit runs."
      not_in_export: This export doesn't contain the link between bot conversations and the cases that followed them. The link may well exist in your bot or your helpdesk; it isn't in these files.
    note: >-
      The engine reports these words verbatim, and uses warn_title on the amber
      path, because the account and the timings are present and "aren't linked"
      would misdescribe the export. Only the green path is implemented. Amber is a
      limit of this tool, not a flaw in the data, so the use reports "needs a
      human" rather than amber "usable with care".

uses:
  - id: resolution
    title: Resolution time analysis
    required: [C1, C4, B4]
    optional: [B5, B6]
  - id: transfers
    title: Transfers and ownership
    required: [C1, C2]
    optional: [C3, B7]
  - id: csat
    title: CSAT and survey analysis
    required: [C1, B8]
    optional: [B2]
  - id: churn
    title: Linking cases to churn
    required: [C1, B9, B10]
    optional: [C2]
  - id: ai
    title: AI self-help readiness
    required: [AI1, AI2, AI4]
    optional: [AI3, AI5, AI6, B2, B3]
  - id: resolution_audit
    title: Bot resolution audit
    required: [B11]
    optional: []
    # This use needs a second file. Without one it still reports not_in_export, so
    # the question and what it would take are visible, but it is left out of the
    # fix-first weighting: nobody who uploaded case data alone should be told to
    # fix bot linking before fixing their cases.
    needs_file: bot

signals:
  - id: slow_passed
    title: Slow and passed-around cases
    unlocked_by_uses: [transfers, resolution]
    params: { slow_days: 30, min_owners: 3, provisional: true }
    shows: Cases open more than 30 days with three or more owners, by group
    disclaimer: The one service signal worth watching. Not proof that it causes churn.
  - id: handoff
    title: Handed off versus held
    unlocked_by_uses: [transfers]
    shows: Resolution time and CSAT for cases kept by one owner versus handed on
    disclaimer: Harder cases get handed on, so this isn't a fair comparison of teams.
  - id: theme_movers
    title: Theme movers
    unlocked_by_any_check: [AI1, B2]
    shows: Reasons rising or falling in the last quarter against the previous nine months
    disclaimer: Shows what is moving, not why.
  - id: open_risk
    title: Open work at risk
    unlocked_by_uses: [resolution]
    requires_fields: [last_update_at]
    shows: Open cases older than 70% of closed cases took to resolve
    disclaimer: Not a prediction of which customers will leave.
  - id: exit_events
    title: Exit events
    requires_fields: [exit_event]
    shows: Cancellations and similar events logged in cases, for whoever owns retention
    disclaimer: A commercial warning recorded in support, not something support caused.
  - id: self_help
    title: AI self-help candidates
    unlocked_by_uses: [ai]
    shows: Reasons that are frequent, quick, single-owner and documented
    disclaimer: A shortlist to test, not a deflection forecast.
  - id: keep_human
    title: Keep-a-human themes
    unlocked_by_uses: [ai, transfers]
    shows: Reasons with long resolution times or many owners
    disclaimer: Where automation is most likely to frustrate customers.

# Parameters for the resolution audit. Every value is provisional: a starting
# point to calibrate against real bot exports, not evidence. Don't quote them
# publicly.
resolution_audit:
  params:
    provisional: true
    return_windows_days: [7, 14, 30]   # contradictions counted cumulatively; the largest is the whole window
    # The escalation window and the return window are adjacent, not separated: a
    # case at or inside this many minutes of the bot ending is an escalation, and
    # anything after it is a return. There is deliberately no third parameter for
    # where returns begin. A gap would quietly bank every same-theme case that
    # landed in it as "not contradicted", which is the one answer it cannot be.
    escalation_within_minutes: 60
    normalise_reasons: true            # same-theme matching must fold near-duplicate reasons ("Login Issues", "Single sign-on") to their base theme, or real returns are missed
  disclaimer: >-
    "Not contradicted" means silence, not success. It records only that no
    follow-up case appeared in the window: the customer may have given up, gone
    elsewhere, or left. Never report it as a resolution rate.

# Where the vendor column names in `fields` synonyms came from. Each name was read
# from the page named here, not recalled. A vendor missing from this list is a vendor
# whose names we could not read: better an honest gap than a plausible invention.
column_name_sources:
  zendesk: zendesk-ticket-object
  freshdesk: freshdesk-api
  intercom: intercom-conversation
  hubspot: hubspot-tickets
  jira_service_management: jira-issue-fields
  # Salesforce is deliberately absent. developer.salesforce.com returns 403 to
  # automated fetches and help.salesforce.com renders its field tables in JavaScript,
  # so the Case object's field list could not be read. The normaliser handles
  # Salesforce's shapes anyway (CaseNumber, CreatedDate, Priority__c, Date/Time
  # Opened all map correctly); only the vendor-specific synonyms are missing.

vendor_questions:
  - How do you define a resolution, and how do you count reopens?
  - Do you report containment separately from resolution?
  - What minimum ticket history and monthly volume do you need?
  - Do you learn from our past tickets, our knowledge articles, or both?
  - What happens when our reasons or tags overlap?
  - Who grades the resolutions, you or us?

